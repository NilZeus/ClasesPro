<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pago confirmado | ClasesPro</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #111827 40%, #1d4ed8);
      color: white;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }
    .card {
      max-width: 540px;
      width: 90%;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 18px;
      padding: 40px 30px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    }
    .check {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 40px;
      margin: 0 auto 20px;
      background: rgba(34,197,94,0.18);
      border: 2px solid #22c55e;
    }
    h1 { margin: 0 0 12px; font-size: 2rem; }
    p { font-size: 1rem; line-height: 1.6; color: #dbeafe; }
    a {
      display: inline-block;
      margin-top: 20px;
      background: #22c55e;
      color: #04120a;
      text-decoration: none;
      font-weight: 700;
      padding: 12px 22px;
      border-radius: 999px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="check">✓</div>
    <h1>¡Pago confirmado!</h1>
    <p>Tu reserva ha sido registrada correctamente. En breve recibirás la confirmación y los detalles de la clase por correo.</p>
    <a href="index2.html">Volver al inicio</a>
  </div>
</body>
</html>
